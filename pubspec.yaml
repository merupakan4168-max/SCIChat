name: scichat
description: "SciChat — AI Research Assistant for scientific journals and articles"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  provider: ^6.1.1
  http: ^1.2.0
  flutter_animate: ^4.5.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^11.2.0
  uuid: ^4.3.3
  xml: any
  url_launcher: ^6.2.5
  fl_chart: ^1.2.0
  syncfusion_flutter_pdf: any
  syncfusion_flutter_pdfviewer: any
  file_picker: ^13.1.0
  flutter_markdown_latex: ^0.3.4
  markdown: ^7.3.1
  path_provider: ^2.1.2
  share_plus: ^13.3.1
  flutter_markdown_plus: ^1.0.12
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "assets/icons/adaptive_background.png"
  adaptive_icon_foreground: "assets/icons/adaptive_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
